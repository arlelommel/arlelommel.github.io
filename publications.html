<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Publications, standards, webinars, presentations, and other research outputs by Arle Lommel.">
  <title>Research Record | Arle Lommel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/cv-publications.css">
</head>
<body>
  <header class="site-header"><div class="shell nav-wrap"><a class="site-name" href="index.html">Arle Lommel</a><nav class="site-nav" aria-label="Primary navigation"><a href="research.html">Research</a><a href="projects.html">Projects</a><a href="contributions.html">Contributions</a><a href="cv.html">CV</a><a href="about.html">About</a></nav></div></header>
  <main class="shell">
    <header class="cv_page-intro">
      <p class="eyebrow">Research record</p>
      <h1>Publications &amp; presentations</h1>
      <p class="lede">Research reports, peer-reviewed work, standards, webinars, presentations, and other selected outputs.</p>
      <div class="cv_controls">
        <div class="cv_search-group"><label for="cv_search">Search</label><input class="cv_search" id="cv_search" type="search" placeholder="Title, author, topic, or keyword"></div>
        <div><span class="cv_filter-label">Format</span><div class="cv_filters" role="group" aria-label="Filter by format">
          <button class="cv_filter" data-type="all" aria-pressed="true">All</button>
          <button class="cv_filter" data-type="csa-report" aria-pressed="false">CSA Research</button>
          <button class="cv_filter" data-type="peer-reviewed" aria-pressed="false">Peer-reviewed</button>
          <button class="cv_filter" data-type="webinar" aria-pressed="false">Webinars</button>
          <button class="cv_filter" data-type="standard" aria-pressed="false">Standards</button>
          <button class="cv_filter" data-type="book-chapter" aria-pressed="false">Books &amp; chapters</button>
          <button class="cv_filter" data-type="presentation" aria-pressed="false">Presentations</button>
        </div></div>
      </div>
      <p class="cv_status" id="cv_status" aria-live="polite"></p>
    </header>
    <div id="cv_publications"><p class="cv_empty">Loading research record…</p></div>
  </main>
  <footer class="site-footer"><div class="shell footer-wrap"><p>© <span id="year"></span> Arle Lommel</p><div class="footer-links"><a href="cv.html">CV</a><a href="index.html">Home</a></div></div></footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
  <script src="assets/js/cv-publications.js"></script>
</body>
</html>
