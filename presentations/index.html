<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Presentations, keynotes, and webinars by Arle Lommel.">
	<title>Presentations | Arle Lommel</title>
	<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="stylesheet" href="/assets/css/presentations.css">
</head>
<body>
	<div id="site-header"></div>

	<main>
		<header class="pres_masthead shell">
			<p class="eyebrow">Presentations</p>
			<h1>Talks, keynotes, and public engagement.</h1>
			<p class="pres_intro">
				A record of conference presentations, invited talks, keynotes, and webinars spanning research, language technology, localization, standards, and multilingual AI.
			</p>
		</header>

		<section class="pres_presentations shell" aria-labelledby="pres_presentations-heading">
			<h2 class="pres_visually-hidden" id="pres_presentations-heading">Presentation list</h2>

			<div class="pres_controls">
				<div class="pres_search-wrap">
					<label for="pres_search">Search presentations</label>
					<input id="pres_search" type="search" autocomplete="off" placeholder="Search titles, speakers, events, and descriptions">
				</div>

				<div class="pres_filter-wrap">
					<p class="pres_control-label">Filter by type</p>
					<div class="pres_filters" id="pres_filters" role="group" aria-label="Presentation type filters"></div>
				</div>
			</div>

			<p class="pres_status" id="pres_status" aria-live="polite"></p>
			<div class="pres_results" id="pres_results"></div>
		</section>
	</main>

	<div id="site-footer"></div>
	<script src="/assets/js/includes.js"></script>
	<script src="/assets/js/presentations.js"></script>
</body>
</html>
