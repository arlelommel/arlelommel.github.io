<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Publications, standards, webinars, presentations, and other research outputs by Arle Lommel.">
	<title>Research Record | Arle Lommel</title>
	<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="stylesheet" href="/assets/css/cv-publications.css">
</head>
<body>
	<div id="site-header"></div>
	<main class="shell">
		<header class="cv_page-intro">
			<p class="eyebrow">Research record</p>
			<h1>Publications &amp; presentations</h1>
			<p class="lede">Research reports, peer-reviewed work, standards, webinars, presentations, and other selected outputs.</p>
			<div class="cv_controls">
				<div class="cv_search-group"><label for="cv_search">Search</label><input class="cv_search" id="cv_search" type="search" placeholder="Title, author, topic, or keyword"></div>
				<div><span class="cv_filter-label">Format</span><div class="cv_filters" role="group" aria-label="Filter by format">
					<button class="cv_filter" data-type="all" aria-pressed="false">All</button>
					<button class="cv_filter" data-type="csa-report" aria-pressed="true">CSA Research</button>
					<button class="cv_filter" data-type="peer-reviewed" aria-pressed="false">Peer-Reviewed Articles</button>
					<button class="cv_filter" data-type="editorship" aria-pressed="false">Editorships</button>
					<button class="cv_filter" data-type="webinar" aria-pressed="false">Webinars</button>
					<button class="cv_filter" data-type="standard" aria-pressed="false">Standards</button>
					<button class="cv_filter" data-type="book-chapter" aria-pressed="false">Chapters</button>
					<button class="cv_filter" data-type="review" aria-pressed="false">Reviews</button>
					<button class="cv_filter" data-type="translation" aria-pressed="false">Translations</button>
					<button class="cv_filter" data-type="presentation" aria-pressed="false">Academic Presentations</button>
					<button class="cv_filter" data-type="dataset" aria-pressed="false">Datasets</button>
				</div></div>
			</div>
			<p class="cv_status" id="cv_status" aria-live="polite"></p>
		</header>
		<div id="cv_publications"><p class="cv_empty">Loading research record…</p></div>
	</main>
	<div id="site-footer"></div>
	<script src="/assets/js/cv-publications.js"></script>
	<script src="/assets/js/includes.js"></script>
</body>
</html>
