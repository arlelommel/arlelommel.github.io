<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Selected and complete publications by Arle Lommel.">
	<title>Publications | Arle Lommel</title>
	<link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="/assets/css/style.css">
	<link rel="stylesheet" href="/assets/css/publications.css">
</head>
<body>
	<div id="site-header"></div>

	<main>
		<header class="pub_masthead shell">
			<p class="eyebrow">Publications</p>
			<h1>Research, analysis, and scholarly work.</h1>
			<p class="pub_intro">
				Selected work highlights publications that are particularly representative of my research and professional interests. The complete record can be searched and filtered by publication type.
			</p>
		</header>

		<section class="pub_publications shell" aria-labelledby="pub_publications-heading">
			<h2 class="pub_visually-hidden" id="pub_publications-heading">Publication list</h2>

			<div class="pub_mode-switch" role="group" aria-label="Publication view">
				<button class="pub_mode-button is-active" type="button" data-mode="selected" aria-pressed="true">Selected</button>
				<button class="pub_mode-button" type="button" data-mode="all" aria-pressed="false">All publications</button>
			</div>

			<div class="pub_all-controls" id="pub_all-controls" hidden>
				<div class="pub_search-wrap">
					<label for="pub_search">Search publications</label>
					<input id="pub_search" type="search" autocomplete="off" placeholder="Search titles, authors, abstracts, and citations">
				</div>

				<div class="pub_filter-wrap">
					<p class="pub_control-label">Filter by type</p>
					<div class="pub_filters" id="pub_filters" role="group" aria-label="Publication type filters"></div>
				</div>
			</div>

			<p class="pub_status" id="pub_status" aria-live="polite"></p>
			<div class="pub_results" id="pub_results"></div>

			<p class="pub_selected-footer" id="pub_selected-footer">
				<button class="pub_all-link" type="button" data-switch-to-all>See all publications <span aria-hidden="true">→</span></button>
			</p>
		</section>
	</main>

	<div id="site-footer"></div>
	<script src="/assets/js/includes.js"></script>
	<script src="/assets/js/publications.js"></script>
</body>
</html>
